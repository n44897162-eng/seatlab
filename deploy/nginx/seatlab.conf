# SeatLab — reverse proxy config for nginx.
# Install:
#   sudo cp deploy/nginx/seatlab.conf /etc/nginx/sites-available/seatlab
#   sudo ln -s /etc/nginx/sites-available/seatlab /etc/nginx/sites-enabled/seatlab
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace seatlab.example.edu.cn with your own domain (or use `server_name _;`
# if this host serves a single site) and adjust the certificate lines.

upstream seatlab_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=seatlab_api:10m rate=10r/s;

server {
    listen 80;
    server_name seatlab.example.edu.cn;

    # certbot --nginx will add the TLS block and the redirect below.
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/seatlab.access.log;
    error_log  /var/log/nginx/seatlab.error.log;

    client_max_body_size 64k;

    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 512;
    gzip_proxied any;

    # Container / systemd health probe: don't log it.
    location = /healthz {
        access_log off;
        proxy_pass http://seatlab_api;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=seatlab_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://seatlab_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /optimize and /pricing run dozens of simulations:
        # 40 cells take 30-60 s, so the default 60 s would 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Interactive demo page and static assets.
    location / {
        proxy_pass http://seatlab_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
