<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeatLab · 学生端</title>
<style>
  :root{
    --paper:#F7F2E8; --ink:#23211C; --muted:#6F6657; --rule:#DCD3C4;
    --accent:#B4452C; --green:#1E5A54; --amber:#C08A2E; --slate:#63758C;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",Georgia,serif;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:44px 22px 60px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;
    border-bottom:1px solid var(--rule);padding-bottom:14px}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent)}
  h1{font-size:26px;margin:6px 0 0}
  nav{font-family:var(--mono);font-size:12px;display:flex;gap:12px}
  nav a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(30,90,84,.3)}
  nav a:hover{color:var(--accent);border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:330px 1fr;gap:24px;margin-top:22px}
  .panel{background:#FBF7EF;border:1px solid var(--rule);padding:18px}
  .panel + .panel{margin-top:16px}
  h3{font-size:13px;margin:0 0 10px;font-family:var(--mono);letter-spacing:.06em}
  label{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin:8px 0 4px}
  input,select{width:100%;padding:7px 8px;border:1px solid var(--rule);background:#fff;
    font-family:var(--mono);font-size:12.5px}
  button{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);border:0;
    padding:9px 13px;cursor:pointer}
  button:hover{background:var(--accent)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button[disabled]{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .zones{display:grid;gap:8px}
  .zone{border:1px solid var(--rule);background:#fff;padding:9px 11px;cursor:pointer;
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px}
  .zone.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .zone b{font-weight:600}
  .zone span{color:var(--muted)}
  .notice{font-size:12.5px;color:#3C362C;border-left:2px solid var(--amber);padding:2px 0 2px 10px;
    margin:8px 0}
  .legend{display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:8px 0}
  .dot{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:middle}
  #seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px;
    max-height:330px;overflow:auto;padding-right:2px}
  .seat{aspect-ratio:1;border:1px solid rgba(0,0,0,.06);background:#E9E1D2;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;
    color:transparent}
  .seat:hover{color:var(--ink);outline:1px solid var(--accent)}
  .seat.reserved{background:var(--amber);cursor:not-allowed}
  .seat.occupied{background:var(--green);cursor:not-allowed}
  .seat.away{background:var(--slate);cursor:not-allowed}
  .seat.mine{outline:2px solid var(--green);color:var(--ink)}
  .seat.selected{outline:2px solid var(--accent);box-shadow:0 0 0 2px rgba(180,69,44,.22);color:var(--ink)}
  .seat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .mine-card{border:1px solid var(--rule);background:#fff;padding:14px}
  .mine-card h4{margin:0 0 6px;font-size:14px}
  .kv{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;
    padding:3px 0;border-bottom:1px dashed var(--rule)}
  .kv b{color:var(--ink);font-weight:600}
  .code{font-family:var(--mono);font-size:26px;letter-spacing:.35em;color:var(--accent);margin:8px 0}
  .countdown{font-family:var(--mono);font-size:13px;color:var(--green)}
  .cin{width:96px!important;display:inline-block;letter-spacing:.18em;text-align:center;
    font-size:14px!important;padding:7px 8px!important}
  .status-line{font-family:var(--mono);font-size:11.5px;margin:4px 0 8px}
  .status-line.open{color:var(--green)} .status-line.closed{color:var(--accent)}
  .wait-card{border:1px dashed var(--rule);background:#fff;padding:12px;margin-bottom:10px}
  .wait-card h4{margin:0 0 4px;font-size:13px}
  .hint{font-size:11.5px;color:var(--muted);margin:4px 0 0}
  #toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:12px;padding:9px 13px;opacity:0;transition:opacity .2s;
    pointer-events:none;max-width:340px}
  #toast.show{opacity:1}
  .gate{position:fixed;inset:0;background:var(--paper);z-index:10;display:flex;align-items:center;
    justify-content:center}
  .gate .panel{width:340px;padding:24px}
  .gate h2{font-size:18px;margin:0 0 4px}
  .gate p{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .gate a.sso{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
    padding:11px 14px;border-radius:8px;font-size:14px;margin:6px 0 0}
  .gate a.sso:hover{filter:brightness(1.08)}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;
    gap:12px;flex-wrap:wrap}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="panel">
    <div class="kicker">SEATLAB · STUDENT APP</div>
    <h2>进入学生端</h2>
    <div id="sso-box" style="display:none">
      <p>使用学校统一身份认证登录，预约记录会自动绑定你的学号。</p>
      <a class="sso" id="sso-link" href="/auth/login?next=/app">校园账号登录</a>
      <p id="sso-hint" style="margin-top:12px"></p>
    </div>
    <div id="local-fields">
      <p>输入学号（或校园卡号）。演示部署可用任意字符串，例如 <code>20241001</code>。</p>
      <label>学号</label><input id="sid" placeholder="20241001">
      <div class="row" style="margin-top:10px"><button id="enter">进入</button></div>
    </div>
    <div id="appkey-field">
      <label>访问码（部署启用 SEATLAB_APP_KEY 时填写）</label><input id="appkey" placeholder="可留空">
      <div class="row" style="margin-top:10px"><button id="enter-appkey">继续</button></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker">SEATLAB · STUDENT APP · 1.4.0</div>
      <h1 id="hello">座位预约</h1>
    </div>
    <nav><a href="/">概览</a><a href="/app">学生端</a><a href="/design">设计器</a><a href="/admin">控制台</a><a href="#" id="logout" style="display:none">退出</a></nav>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <h3>当前开放</h3>
        <div id="venue-line" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></div>
        <div id="venue-status" class="status-line"></div>
        <label>选择区域</label>
        <div class="zones" id="zones"></div>
        <label>时长（分钟）</label>
        <select id="minutes"><option value="60">1 小时</option><option value="120">2 小时</option>
          <option value="180" selected>3 小时</option><option value="240">4 小时</option></select>
        <div id="duration-hint" class="hint"></div>
        <div class="row" style="margin-top:12px">
          <button id="reserve">随机空座预约</button>
          <button class="ghost" id="waitlist">加入候补</button>
        </div>
        <div id="pick-hint" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
      </div>

      <div class="panel">
        <h3>通知</h3>
        <div id="notices"></div>
      </div>

      <div class="panel">
        <h3>举报占座</h3>
        <label>座位编号（如 A-012）</label><input id="rp-seat" list="seat-labels" placeholder="A-012">
        <datalist id="seat-labels"></datalist>
        <label>情况</label><input id="rp-note" placeholder="座位上只有书，超过 30 分钟没人">
        <div class="row" style="margin-top:10px"><button class="ghost" id="report">提交</button></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>我的座位</h3>
        <div id="mine"><div style="color:var(--muted);font-size:13px">还没有进行中的预约。</div></div>
      </div>

      <div class="panel">
        <h3>座位图 <span id="zone-tag" class="kicker"></span></h3>
        <div class="legend">
          <span><i class="dot" style="background:#E9E1D2"></i>空闲（点选）</span>
          <span><i class="dot" style="background:var(--amber)"></i>预约</span>
          <span><i class="dot" style="background:var(--green)"></i>在座</span>
          <span><i class="dot" style="background:var(--slate)"></i>暂离</span>
        </div>
        <div id="seats"></div>
      </div>
    </div>
  </div>

  <footer>
    <span>MIT License · seatlab 1.4.0 · student app</span>
    <span>预约 → 15 分钟内签到 → 暂离 ≤30 分钟 → 释放</span>
  </footer>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let STU = localStorage.getItem("seatlab_student_id") || "";
let APPKEY = localStorage.getItem("seatlab_app_key") || "";
let AUTH = {mode:"header", sso:false, csrf:"", name:""};
let selectedZone = null, selectedSeat = null, mineList = [], waitingList = [], seatsById = {};
let AV = {open:true, minutes_to_close:0, at:""};
let MAXMIN = 240, MAXACTIVE = 2, AWAYLIM = 30;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3000); }

async function api(path, opts={}){
  const headers = {"Content-Type":"application/json"};
  if(!AUTH.sso && STU) headers["X-Student-ID"] = STU;
  if(APPKEY) headers["X-App-Key"] = APPKEY;
  if(AUTH.csrf) headers["X-CSRF-Token"] = AUTH.csrf;
  const res = await fetch(path, {...opts, credentials:"same-origin", headers:{...headers, ...(opts.headers||{})}});
  const data = await res.json().catch(()=>({detail:res.statusText}));
  if(!res.ok){ const err=new Error(data.detail || String(res.status)); err.status=res.status; throw err; }
  return data;
}
async function getJson(path){ const r=await fetch(path,{credentials:"same-origin"}); return r.json(); }
function showGate(){ $("gate").style.display = "flex"; }
const post = (p,b) => api(p,{method:"POST",body:JSON.stringify(b||{})});
const fmt = (m)=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

async function loadVenue(){
  const v = await api("/api/v1/app/venue");
  MAXMIN = v.max_reservation_minutes || 240;
  MAXACTIVE = v.max_active_reservations || 2;
  AWAYLIM = v.away_limit_min || 30;
  if(!selectedZone || !v.zones.some(z=>z.key===selectedZone)) selectedZone = v.zones[0]?.key || null;
  $("hello").textContent = "你好，" + (AUTH.name || STU);
  $("venue-line").textContent = `${v.name} · ${fmt(v.open_window[0])}–${fmt(v.open_window[1])} · 机制 ${v.policy}`;
  const av = await api("/api/v1/app/availability");
  AV = av;
  const status = $("venue-status");
  if(av.open){
    status.className = "status-line open";
    status.textContent = `开放中 · 距闭馆 ${av.minutes_to_close} 分钟 · 同时最多 ${MAXACTIVE} 个预约`;
  }else{
    status.className = "status-line closed";
    status.textContent = `已闭馆 · 开放时间 ${fmt(v.open_window[0])}–${fmt(v.open_window[1])}`;
  }
  const canBook = av.open && av.minutes_to_close >= 30;
  $("reserve").disabled = !canBook;
  $("waitlist").disabled = !av.open;
  $("minutes").disabled = !canBook;
  $("duration-hint").textContent = canBook
    ? `闭馆前还剩 ${av.minutes_to_close} 分钟，超过会自动缩短并在结果里提示。`
    : "当前不可预约；闭馆前不足 30 分钟时也会停止新建预约。";
  $("zones").innerHTML = av.zones.map(z=>
    `<div class="zone ${z.key===selectedZone?'active':''}" data-zone="${esc(z.key)}" role="button" tabindex="0">
      <div><b>${esc(z.name)}</b><br><span>${esc(z.key)} 区 · 候补 ${z.waiting}</span></div>
      <div style="text-align:right"><b>${z.free}</b><br><span>空闲 / 共 ${z.total}</span></div></div>`).join("");
  document.querySelectorAll(".zone").forEach(el=>{
    const pick = ()=>{ selectedZone=el.dataset.zone; selectedSeat=null; loadVenue(); loadSeats(); };
    el.onclick = pick;
    el.onkeydown = (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); pick(); } };
  });
  $("zone-tag").textContent = selectedZone ? selectedZone + " 区" : "";
  const n = await api("/api/v1/app/announcements");
  $("notices").innerHTML = n.announcements.map(a=>
    `<div class="notice"><b>${esc(a.title)}</b><br>${esc(a.body)}</div>`).join("")
    || `<div style="color:var(--muted);font-size:12.5px">暂无通知</div>`;
  updatePickHint();
}

function updatePickHint(){
  const s = selectedSeat ? seatsById[selectedSeat] : null;
  $("pick-hint").textContent = s ? `已选：${s.label}` : "点击任意空闲座位可指定，不选则自动分配";
}

async function loadSeats(){
  if(!selectedZone){ $("seats").innerHTML=""; return; }
  const d = await api(`/api/v1/app/seats?zone=${encodeURIComponent(selectedZone)}`);
  const scrollTop = $("seats").scrollTop;
  seatsById = {};
  d.seats.forEach(s=>seatsById[s.id]=s);
  if(selectedSeat && !d.seats.some(s=>s.id===selectedSeat && s.status==="free")) selectedSeat = null;
  const mineSeats = new Set(mineList.map(r=>r.seat_id));
  $("seats").innerHTML = d.seats.map(s=>{
    const cls = [s.status, mineSeats.has(s.id)?"mine":"", selectedSeat===s.id?"selected":""].filter(Boolean).join(" ");
    const free = s.status === "free";
    return `<div class="seat ${esc(cls)}" data-id="${s.id}" data-label="${esc(s.label)}" role="button" tabindex="${free?0:-1}"
      aria-label="${esc(s.label)}，${free?"空闲，可预约":esc(s.status)}" title="${esc(s.label)} · ${esc(s.status)}">${esc(s.label.split("-")[1])}</div>`;
  }).join("");
  $("seats").scrollTop = scrollTop;

  const pick = (id)=>{
    const s = seatsById[id];
    if(!s || s.status!=="free") return toast("该座位当前不可选");
    selectedSeat = id;
    document.querySelectorAll(".seat.selected").forEach(x=>x.classList.remove("selected"));
    const el = document.querySelector(`.seat[data-id="${id}"]`);
    if(el){ el.classList.add("selected"); el.focus?.(); }
    updatePickHint();
  };
  document.querySelectorAll(".seat").forEach(el=>{
    el.onclick = ()=>pick(+el.dataset.id);
    el.onkeydown = (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); pick(+el.dataset.id); } };
  });

  $("seat-labels").innerHTML = d.seats.map(s=>`<option value="${esc(s.label)}">`).join("");
  updatePickHint();
}

async function loadMine(){
  const me = await api(`/api/v1/app/me?student_id=${encodeURIComponent(STU)}`);
  mineList = me.active || [];
  waitingList = me.waiting || [];
  const pointsCls = me.blocked ? "kv" : "kv";
  const points = me.blocked
    ? `<div class="${pointsCls}" style="color:var(--accent)"><span>信用分</span><b>${me.points} / ${me.threshold} · 暂停预约至 ${esc(String(me.blocked_until||"").slice(11,16))}</b></div>`
    : `<div class="${pointsCls}"><span>信用分</span><b>${me.points} / ${me.threshold}</b></div>`;
  const waiting = waitingList.map(w=>`
    <div class="wait-card">
      <h4>候补中 · ${esc(w.zone)} 区</h4>
      <div class="kv"><span>排队位置</span><b>第 ${w.position} 位</b></div>
      <div class="hint">有座位释放后，请回到本页预约；系统不会替他人占座。</div>
      <button class="ghost" style="margin-top:8px" onclick="leaveWait('${esc(w.zone)}')">离开候补</button>
    </div>`).join("");
  if(!mineList.length && !waitingList.length){
    $("mine").innerHTML = `<div style="color:var(--muted);font-size:13px">还没有进行中的预约。</div><div class="mine-card" style="margin-top:10px">${points}</div>`;
    return;
  }
  const statusText = {reserved:"已预约，待签到", checked_in:"在座", away:"暂离中"};
  const cards = mineList.map(r=>{
    const deadline = r.status==="reserved" ? r.expires_at : (r.status==="away" ? r.away_until : r.expires_at);
    const seat = seatsById[r.seat_id];
    const awayChoices = [5,10,15,20,30].filter(m=>m<=AWAYLIM);
    const awayDefault = awayChoices.includes(15) ? 15 : (awayChoices[awayChoices.length-1] || 5);
    const awayOptions = awayChoices.map(m=>`<option value="${m}"${m===awayDefault?" selected":""}>${m} 分钟</option>`).join("");
    return `
    <div class="mine-card" style="margin-bottom:10px">
      <h4>${statusText[r.status]||esc(r.status)} <span class="tag">#${r.id}</span></h4>
      <div class="kv"><span>座位</span><b>${esc(seat?seat.label:(r.seat_label||r.seat_id))} · ${esc(r.zone)} 区</b></div>
      ${r.status==="reserved" ? `<div class="code">${esc(r.code)}</div>
        <div class="kv"><span>签到截止</span><b>${esc(String(r.expires_at).slice(11,16))}</b></div>
        <div class="row" style="margin-top:8px;align-items:center">
          <input class="cin" id="cin-${r.id}" inputmode="numeric" maxlength="4" placeholder="4 位签到码" aria-label="签到码">
          <button onclick="checkin(${r.id})">签到</button>
        </div>` : ``}
      ${r.status==="checked_in" ? `<div class="kv"><span>本次结束</span><b>${esc(String(deadline||"").slice(11,16))}</b></div>
        <div class="row" style="margin-top:8px;align-items:center">
          <select id="away-${r.id}" style="width:auto" aria-label="暂离时长">${awayOptions}</select>
          <button class="ghost" onclick="away(${r.id})">暂离</button>
        </div>` : ``}
      ${r.status==="away" ? `<div class="kv"><span>暂离截止</span><b>${esc(String(deadline||"").slice(11,16))}</b></div>
        <div class="row" style="margin-top:8px"><button onclick="back(${r.id})">我回来了</button></div>` : ``}
      <div class="countdown" data-res="${r.id}"></div>
      <div class="row" style="margin-top:12px"><button class="ghost" onclick="release(${r.id})">释放座位</button></div>
    </div>`;
  }).join("");
  $("mine").innerHTML = cards + waiting + `<div class="mine-card">${points}</div>`;
  tick();
}
const resById = (id) => mineList.find(r=>r.id===+id);
function tick(){
  document.querySelectorAll(".countdown").forEach(el=>{
    const r = resById(el.dataset.res); if(!r){ el.textContent=""; return; }
    const target = r.status==="away" ? r.away_until : r.expires_at;
    if(!target){ el.textContent=""; return; }
    const ms = new Date(target) - new Date();
    if(ms<=0){ el.textContent = r.status==="reserved" ? "签到时间已到" : "时间已到"; return; }
    const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60;
    el.textContent = `剩余 ${m} 分 ${String(s).padStart(2,"0")} 秒`;
  });
}
setInterval(tick, 1000);

async function reserve(){
  try{
    const body = {student_id:STU, zone:selectedZone, minutes:+$("minutes").value};
    if(selectedSeat) body.seat_id = selectedSeat;
    const r = await post("/api/v1/app/reservations", body);
    let msg = `预约成功：${r.seat_label}，签到码 ${r.code}`;
    if(r.clamped) msg += `（已缩短为 ${r.minutes} 分钟，闭馆前结束）`;
    toast(msg);
    selectedSeat=null; $("pick-hint").textContent="";
    await loadMine(); await loadSeats(); await loadVenue();
  }catch(e){
    const m = /waitlist position (\d+)/.exec(e.message);
    if(m){ toast(`区域已满，已加入候补第 ${m[1]} 位`); await loadMine(); await loadVenue(); }
    else toast("预约失败："+e.message);
  }
}
async function checkin(id){
  const r = resById(id); if(!r) return;
  const input = $("cin-"+id); const code = (input?.value || "").trim();
  if(!/^\d{4}$/.test(code)) return toast("请输入 4 位签到码");
  try{
    const out = await post(`/api/v1/app/reservations/${r.id}/checkin`,{student_id:STU,code});
    toast("签到成功：" + (out.seat_label||""));
    await loadMine(); await loadSeats();
  }catch(e){ toast("签到失败："+e.message); }
}
async function away(id){
  const r = resById(id); if(!r) return;
  const minutes = +($("away-"+id)?.value || 15);
  try{ await post(`/api/v1/app/reservations/${r.id}/away`,{student_id:STU,minutes});
    toast(`已暂离 ${minutes} 分钟，请在截止前回来`); await loadMine(); await loadSeats();
  }catch(e){ toast("失败："+e.message); }
}
async function back(id){
  const r = resById(id); if(!r) return;
  try{ await post(`/api/v1/app/reservations/${r.id}/back`,{student_id:STU});
    toast("欢迎回来"); await loadMine(); await loadSeats();
  }catch(e){ toast("失败："+e.message); }
}
async function release(id){
  const r = resById(id); if(!r) return;
  if(!confirm(`确定释放预约 #${id}？座位会立即回到空闲。`)) return;
  try{ await api(`/api/v1/app/reservations/${r.id}?student_id=${encodeURIComponent(STU)}`,{method:"DELETE"});
    toast("座位已释放"); await loadMine(); await loadSeats(); await loadVenue();
  }catch(e){ toast("失败："+e.message); }
}
async function joinWait(){
  try{ const r= await post("/api/v1/app/waitlist",{student_id:STU,zone:selectedZone});
    toast(`已加入候补，第 ${r.position} 位`); await loadMine(); await loadVenue();
  }catch(e){ toast("失败："+e.message); }
}
async function leaveWait(zone){
  try{ await api(`/api/v1/app/waitlist?student_id=${encodeURIComponent(STU)}&zone=${encodeURIComponent(zone)}`,{method:"DELETE"});
    toast("已离开候补"); await loadMine(); await loadVenue();
  }catch(e){ toast("失败："+e.message); }
}
async function report(){
  const label=$("rp-seat").value.trim().toUpperCase();
  let seat=Object.values(seatsById).find(s=>s.label===label);
  if(!seat){
    try{ const all=await api("/api/v1/app/seats"); seat=all.seats.find(s=>s.label===label); }catch(_){}
  }
  if(!seat) return toast("没有找到该座位编号，请核对区域与编号");
  const note=$("rp-note").value.trim();
  if(!note) return toast("请填写占座情况");
  try{ const r=await post("/api/v1/app/reports",{student_id:STU,seat_id:seat.id,note});
    toast("已提交举报 #"+r.complaint_id); $("rp-note").value="";
    if(r.holder_flagged) toast("该预约已被标记违规");
  }catch(e){ toast("失败："+e.message); }
}

async function start(){
  APPKEY = $("appkey").value.trim();
  if(!AUTH.sso){
    STU = $("sid").value.trim();
    if(!STU) return toast("请输入学号");
    localStorage.setItem("seatlab_student_id",STU);
  }
  localStorage.setItem("seatlab_app_key",APPKEY);
  try{ await loadAll(); $("gate").style.display="none"; }
  catch(e){ toast("进入失败："+e.message); }
}
$("enter").onclick = async ()=>{
  STU = $("sid").value.trim(); if(!STU) return toast("请输入学号");
  localStorage.setItem("seatlab_student_id",STU);
  await start();
};
$("enter-appkey").onclick = start;
$("logout").onclick = async (e)=>{
  e.preventDefault();
  try{ await fetch("/auth/logout",{method:"POST",credentials:"same-origin"}); }catch(_){}
  AUTH.csrf=""; localStorage.removeItem("seatlab_student_id"); localStorage.removeItem("seatlab_app_key"); location.reload();
};
$("reserve").onclick = reserve;
$("waitlist").onclick = joinWait;
$("report").onclick = report;
$("sid").addEventListener("keydown", e=>{ if(e.key==="Enter") $("enter").click(); });
$("appkey").addEventListener("keydown", e=>{ if(e.key==="Enter") start(); });

async function loadAll(){ await loadVenue(); await loadMine(); await loadSeats(); }
(async function boot(){
  $("sid").value = STU; $("appkey").value = APPKEY;
  let cfg = {sso:false, mode:"header", app_key_required:true};
  try{ cfg = await getJson("/auth/config"); }catch(_){}
  AUTH.mode = cfg.mode || "header"; AUTH.sso = !!cfg.sso;
  if(cfg.app_key_required === false){ $("appkey-field").style.display="none"; }
  if(AUTH.sso){
    $("local-fields").style.display="none";
    $("sso-box").style.display="block";
    try{
      const me = await getJson("/auth/me");
      if(me.authenticated){
        AUTH.csrf = me.csrf || ""; AUTH.name = me.name || me.student_id;
        STU = me.student_id;
        $("logout").style.display="inline";
        await loadAll(); $("gate").style.display="none";
        return;
      }
      $("sso-hint").textContent = "尚未登录，或会话已过期（默认 12 小时）。";
    }catch(e){ $("sso-hint").textContent = "认证服务暂不可用：" + e.message; }
  }else if(STU){
    try{ await loadAll(); $("gate").style.display="none"; }
    catch(e){ if(e.status===401) showGate(); else toast("加载失败："+e.message); }
  }
})();
setInterval(()=>{
  if(document.visibilityState !== "visible" || $("gate").style.display !== "none") return;
  if(document.activeElement && document.activeElement.closest("#mine")) return;
  loadAll().catch(e=>{ if(e.status===401) showGate(); });
}, 8000);
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && $("gate").style.display === "none"){
    loadAll().catch(()=>{});
  }
});
</script>

</body>
</html>
